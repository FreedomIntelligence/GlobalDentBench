      ### L1 — Knowledge Recall
      - The question primarily tests factual knowledge, definitions, concepts, classifications, mechanisms, or direct recall.
      - It does not require meaningful reasoning based on a specific patient case.
      - Any question focused primarily on knowledge assessment should be classified as L1.
      - Questions that require more than knowledge recall, such as patient-specific clinical reasoning, should not be classified as L1.

      ### L2 — Routine Reasoning
